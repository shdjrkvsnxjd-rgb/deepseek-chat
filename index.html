<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DeepSeek Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { width: 100%; max-width: 600px; height: 100vh; display: flex; flex-direction: column; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .header { background: #4F46E5; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
    .chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 80%; padding: 10px 15px; border-radius: 18px; word-wrap: break-word; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #4F46E5; color: white; }
    .assistant { align-self: flex-start; background: #e5e7eb; color: black; }
    .input-area { display: flex; padding: 10px; gap: 10px; border-top: 1px solid #ddd; }
    #messageInput { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 25px; outline: none; font-size: 16px; }
    #sendBtn { width: 50px; height: 50px; border-radius: 50%; border: none; background: #4F46E5; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #sendBtn:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">🤖 DeepSeek Chat</div>
    <div class="chat-box" id="chatBox">
      <div class="message assistant">你好！我是 DeepSeek 助手，有什么可以帮你的？</div>
    </div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off">
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <script>
    // ===== 请将此处替换为你自己的 Cloudflare Worker 地址 =====
    const WORKER_URL = 'https://deepseek-proxy.xinyingchen328.workers.dev'; // 例如 https://deepseek-proxy.xxx.workers.dev

    const chatBox = document.getElementById('chatBox');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // 初始消息列表（可自定义系统提示词）
    let messages = [
      { role: 'system', content: '你是一个乐于助人的助手' }
    ];

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = content;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function setLoading(isLoading) {
      sendBtn.disabled = isLoading;
      messageInput.disabled = isLoading;
    }

    async function sendMessage() {
      const userMessage = messageInput.value.trim();
      if (!userMessage) return;

      addMessage('user', userMessage);
      messages.push({ role: 'user', content: userMessage });
      messageInput.value = '';
      setLoading(true);

      // 显示“思考中…”
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message assistant';
      loadingDiv.textContent = '思考中...';
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'deepseek-v4-flash',   // 目前指向 V4-Flash，也可以改为 'deepseek-v4-flash'
            messages: messages,
            stream: false,
          }),
        });

        const data = await response.json();
        chatBox.removeChild(loadingDiv);

        if (data.choices && data.choices.length > 0) {
          const assistantMessage = data.choices[0].message.content;
          addMessage('assistant', assistantMessage);
          messages.push({ role: 'assistant', content: assistantMessage });
        } else {
          addMessage('assistant', '🔴 请求出错，请稍后重试');
        }
      } catch (error) {
        chatBox.removeChild(loadingDiv);
        addMessage('assistant', '🔴 网络错误，检查 Worker 是否正常');
      } finally {
        setLoading(false);
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
