<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DeepSeek Chat</title>
  <style>
    :root {
      --brand: #C2703D;          /* 暖棕橙 */
      --brand-2: #E0A458;        /* 琥珀 */
      --brand-soft: #FBF1E6;
      --bg: #F6EFE6;             /* 米色背景 */
      --card: #FFFBF5;           /* 奶油卡片 */
      --text: #4A3F35;           /* 暖深棕文字，比纯黑柔和 */
      --text-soft: #8A7A6A;
      --border: #EADFD0;
      --user-bubble: linear-gradient(135deg, #D98E5A, #E6B273);
      --assistant-bubble: #FFFDF9;
      --radius: 18px;
      --shadow: 0 6px 24px rgba(120, 90, 60, 0.10);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
    }
    .container {
      width: 100%;
      max-width: 680px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* 顶部栏 */
    .header {
      background: linear-gradient(135deg, #C2703D, #E0A458);
      color: #FFF8EF;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 2px 12px rgba(194, 112, 61, 0.25);
      z-index: 2;
    }
    .header .title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: .2px;
    }
    .header .logo {
      width: 32px; height: 32px;
      border-radius: 10px;
      background: rgba(255,255,255,0.22);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .header .title small {
      display: block;
      font-size: 11px;
      font-weight: 400;
      opacity: .85;
      margin-top: 1px;
      color: #FFF3E4;
    }
    #exportBtn {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      color: #FFF8EF;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s;
      backdrop-filter: blur(4px);
    }
    #exportBtn:hover { background: rgba(255,255,255,0.3); }
    #exportBtn:active { transform: scale(.97); }

    /* 聊天区 */
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background:
        radial-gradient(1200px 400px at 100% 0%, #FBF1E6 0%, transparent 60%),
        radial-gradient(800px 300px at 0% 100%, #F7EBDA 0%, transparent 55%),
        var(--bg);
      scroll-behavior: smooth;
    }
    .chat-box::-webkit-scrollbar { width: 6px; }
    .chat-box::-webkit-scrollbar-thumb { background: #DCCBB6; border-radius: 3px; }

    .message {
      max-width: 82%;
      padding: 11px 15px;
      border-radius: var(--radius);
      font-size: 15px;
      line-height: 1.6;
      word-wrap: break-word;
      white-space: pre-wrap;
      animation: pop .18s ease-out;
      position: relative;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(6px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: #4A3020;
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 14px rgba(194,112,61,0.22);
    }
    .assistant {
      align-self: flex-start;
      background: var(--assistant-bubble);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
      box-shadow: 0 2px 10px rgba(120,90,60,0.06);
    }

    /* 消息内 Markdown 元素 */
    .message h1, .message h2, .message h3,
    .message h4, .message h5, .message h6 {
      margin: 10px 0 4px;
      font-size: 1em;
      font-weight: 700;
    }
    .message ul, .message ol { padding-left: 20px; margin: 6px 0; }
    .message li { margin: 3px 0; }
    .message code {
      background: rgba(194,112,61,0.10);
      color: #A5542A;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.9em;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .message pre {
      background: #3E342B;      /* 暖深棕代码块，比纯黑护眼 */
      color: #F3E7D8;
      padding: 12px 14px;
      border-radius: 12px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 13px;
      line-height: 1.5;
    }
    .message pre code { background: none; padding: 0; color: inherit; }
    .user code { background: rgba(255,255,255,0.35); color: #6B3F1E; }
    .user pre { background: rgba(60,40,20,0.35); color: #FBF1E6; }

    /* 输入区 */
    .input-area {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: rgba(255,251,245,0.92);
      backdrop-filter: blur(10px);
    }
    #messageInput {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 22px;
      outline: none;
      font-size: 16px;
      background: #FBF5EC;
      transition: border-color .2s, box-shadow .2s, background .2s;
      color: var(--text);
    }
    #messageInput:focus {
      border-color: var(--brand-2);
      background: #FFFDF9;
      box-shadow: 0 0 0 4px rgba(224,164,88,0.18);
    }
    #messageInput::placeholder { color: #B3A392; }

    #sendBtn {
      width: 46px; height: 46px;
      flex: none;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #FFF8EF;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(194,112,61,0.30);
      transition: transform .15s, opacity .2s, box-shadow .2s;
    }
    #sendBtn:active { transform: scale(.94); }
    #sendBtn:disabled { opacity: .5; box-shadow: none; cursor: not-allowed; }

    /* 思考中动画 */
    .typing { display: inline-flex; gap: 4px; align-items: center; }
    .typing i {
      width: 6px; height: 6px; border-radius: 50%;
      background: #C2A184;
      display: inline-block;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .5; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    @media (max-width: 480px) {
      .container { box-shadow: none; }
      .message { max-width: 86%; font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">
        <div class="logo">🤖</div>
        <div>
          DeepSeek Chat
          <small>智能助手 · 随时在线</small>
        </div>
      </div>
      <button id="exportBtn" title="导出当前对话记录">📥 导出</button>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message assistant">你好！我是 DeepSeek 助手，有什么可以帮你的？</div>
    </div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off">
      <button id="sendBtn" aria-label="发送">➤</button>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://deepseek-proxy.xinyingchen328.workers.dev';

    const chatBox = document.getElementById('chatBox');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const exportBtn = document.getElementById('exportBtn');

    let messages = [
      { role: 'system', content: '你是一个乐于助人的助手' }
    ];

    // ===== 保存 / 恢复 =====
    function saveHistory() {
      try {
        localStorage.setItem('chat_history', JSON.stringify(messages));
      } catch (e) {
        console.error('保存失败', e);
      }
    }

    function restoreHistory() {
      const saved = localStorage.getItem('chat_history');
      if (!saved) return;
      try {
        const history = JSON.parse(saved);
        if (!Array.isArray(history) || history.length <= 1) return;
        messages = history.filter(m => m.role === 'user' || m.role === 'assistant' || m.role === 'system');
        chatBox.innerHTML = '';
        for (const m of messages) {
          if (m.role === 'user' || m.role === 'assistant') {
            addMessage(m.role, m.content);
          }
        }
      } catch (e) {
        console.error('读取历史失败', e);
      }
    }

    // 简易 Markdown 渲染
    function renderMarkdown(text) {
      let html = text;
      html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/^###### (.*$)/gm, '<h6>$1</h6>');
      html = html.replace(/^##### (.*$)/gm, '<h5>$1</h5>');
      html = html.replace(/^#### (.*$)/gm, '<h4>$1</h4>');
      html = html.replace(/^### (.*$)/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.*$)/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.*$)/gm, '<h1>$1</h1>');
      html = html.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
      html = html.replace(/^[\-\*] (.*$)/gm, '<li>$1</li>');
      html = html.replace(/^\d+\. (.*$)/gm, '<li>$1</li>');
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = renderMarkdown(content);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function setLoading(isLoading) {
      sendBtn.disabled = isLoading;
      messageInput.disabled = isLoading;
    }

    async function sendMessage() {
      const userMessage = messageInput.value.trim();
      if (!userMessage) return;

      addMessage('user', userMessage);
      messages.push({ role: 'user', content: userMessage });
      saveHistory();
      messageInput.value = '';
      setLoading(true);

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message assistant';
      loadingDiv.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: messages,
            stream: false,
          }),
        });

        const data = await response.json();
        chatBox.removeChild(loadingDiv);

        if (data.choices && data.choices.length > 0) {
          const assistantMessage = data.choices[0].message.content;
          addMessage('assistant', assistantMessage);
          messages.push({ role: 'assistant', content: assistantMessage });
          saveHistory();
        } else {
          addMessage('assistant', '🔴 请求出错，请稍后重试');
        }
      } catch (error) {
        chatBox.removeChild(loadingDiv);
        addMessage('assistant', '🔴 网络错误，检查 Worker 是否正常');
      } finally {
        setLoading(false);
      }
    }

    function exportChat() {
      if (messages.length <= 1) {
        alert('当前没有对话记录可导出');
        return;
      }
      let exportText = '';
      for (let i = 0; i < messages.length; i++) {
        const msg = messages[i];
        if (msg.role === 'user') {
          exportText += `🧑 你：\n${msg.content}\n\n`;
        } else if (msg.role === 'assistant') {
          exportText += `🤖 DeepSeek：\n${msg.content}\n\n`;
        }
      }
      const blob = new Blob([exportText], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const now = new Date();
      const timestamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}`;
      a.download = `DeepSeek聊天记录_${timestamp}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    exportBtn.addEventListener('click', exportChat);

    // 双击标题清空记录
    document.querySelector('.header .title').addEventListener('dblclick', () => {
      if (!confirm('确定清空所有聊天记录？')) return;
      localStorage.removeItem('chat_history');
      messages = [{ role: 'system', content: '你是一个乐于助人的助手' }];
      chatBox.innerHTML = '';
      addMessage('assistant', '你好！我是 DeepSeek 助手，有什么可以帮你的？');
    });

    // 启动恢复历史
    restoreHistory();
  </script>
</body>
</html>
