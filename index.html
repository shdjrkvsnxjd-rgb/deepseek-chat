<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DeepSeek Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { width: 100%; max-width: 600px; height: 100vh; display: flex; flex-direction: column; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .header { background: #4F46E5; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .header span { flex: 1; }
    #exportBtn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5); color: white; padding: 5px 12px; border-radius: 15px; font-size: 14px; cursor: pointer; white-space: nowrap; }
    #exportBtn:active { background: rgba(255,255,255,0.4); }
    .chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 80%; padding: 10px 15px; border-radius: 18px; word-wrap: break-word; white-space: pre-wrap; }
    .message h1, .message h2, .message h3, .message h4, .message h5, .message h6 { margin: 8px 0 4px 0; font-size: inherit; }
    .message ul, .message ol { padding-left: 20px; margin: 4px 0; }
    .message li { margin: 2px 0; }
    .message code { background: rgba(0,0,0,0.08); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    .message pre { background: rgba(0,0,0,0.06); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 6px 0; }
    .message pre code { background: none; padding: 0; }
    .user { align-self: flex-end; background: #4F46E5; color: white; }
    .user code { background: rgba(255,255,255,0.2); }
    .user pre { background: rgba(255,255,255,0.1); }
    .assistant { align-self: flex-start; background: #e5e7eb; color: black; }
    .input-area { display: flex; padding: 10px; gap: 10px; border-top: 1px solid #ddd; }
    #messageInput { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 25px; outline: none; font-size: 16px; }
    #sendBtn { width: 50px; height: 50px; border-radius: 50%; border: none; background: #4F46E5; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #sendBtn:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span>🤖 DeepSeek Chat</span>
      <button id="exportBtn" title="导出当前对话记录">📥 导出记录</button>
    </div>
    <div class="chat-box" id="chatBox">
      <div class="message assistant">你好！我是 DeepSeek 助手，有什么可以帮你的？</div>
    </div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off">
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://deepseek-proxy.xinyingchen328.workers.dev';

    const chatBox = document.getElementById('chatBox');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const exportBtn = document.getElementById('exportBtn');

    let messages = [
      { role: 'system', content: '你是一个乐于助人的助手' }
    ];

    // 简易 Markdown 渲染
    function renderMarkdown(text) {
      let html = text;
      html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/^###### (.*$)/gm, '<h6>$1</h6>');
      html = html.replace(/^##### (.*$)/gm, '<h5>$1</h5>');
      html = html.replace(/^#### (.*$)/gm, '<h4>$1</h4>');
      html = html.replace(/^### (.*$)/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.*$)/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.*$)/gm, '<h1>$1</h1>');
      html = html.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
      html = html.replace(/^[\-\*] (.*$)/gm, '<li>$1</li>');
      html = html.replace(/^\d+\. (.*$)/gm, '<li>$1</li>');
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = renderMarkdown(content);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function setLoading(isLoading) {
      sendBtn.disabled = isLoading;
      messageInput.disabled = isLoading;
    }

    async function sendMessage() {
      const userMessage = messageInput.value.trim();
      if (!userMessage) return;

      addMessage('user', userMessage);
      messages.push({ role: 'user', content: userMessage });
      messageInput.value = '';
      setLoading(true);

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message assistant';
      loadingDiv.textContent = '思考中...';
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: messages,
            stream: false,
          }),
        });

        const data = await response.json();
        chatBox.removeChild(loadingDiv);

        if (data.choices && data.choices.length > 0) {
          const assistantMessage = data.choices[0].message.content;
          addMessage('assistant', assistantMessage);
          messages.push({ role: 'assistant', content: assistantMessage });
        } else {
          addMessage('assistant', '🔴 请求出错，请稍后重试');
        }
      } catch (error) {
        chatBox.removeChild(loadingDiv);
        addMessage('assistant', '🔴 网络错误，检查 Worker 是否正常');
      } finally {
        setLoading(false);
      }
    }

    function exportChat() {
      if (messages.length <= 1) {
        alert('当前没有对话记录可导出');
        return;
      }
      let exportText = '';
      for (let i = 0; i < messages.length; i++) {
        const msg = messages[i];
        if (msg.role === 'user') {
          exportText += `🧑 你：\n${msg.content}\n\n`;
        } else if (msg.role === 'assistant') {
          exportText += `🤖 DeepSeek：\n${msg.content}\n\n`;
        }
      }
      const blob = new Blob([exportText], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const now = new Date();
      const timestamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}`;
      a.download = `DeepSeek聊天记录_${timestamp}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    exportBtn.addEventListener('click', exportChat);
  </script>
</body>
</html>
