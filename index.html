<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DeepSeek Chat</title>
  <style>
    :root {
      --brand: #C2703D;
      --brand-2: #E0A458;
      --brand-soft: #FBF1E6;
      --bg: #F6EFE6;
      --card: #FFFBF5;
      --text: #4A3F35;
      --text-soft: #8A7A6A;
      --border: #EADFD0;
      --user-bubble: linear-gradient(135deg, #D98E5A, #E6B273);
      --assistant-bubble: #FFFDF9;
      --radius: 18px;
      --shadow: 0 6px 24px rgba(120, 90, 60, 0.10);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
    }
    .container {
      width: 100%;
      max-width: 680px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    /* 顶部栏 */
    .header {
      background: linear-gradient(135deg, #C2703D, #E0A458);
      color: #FFF8EF;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 2px 12px rgba(194, 112, 61, 0.25);
      z-index: 2;
    }
    .header .title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: .2px;
    }
    .header .logo {
      width: 32px; height: 32px;
      border-radius: 10px;
      background: rgba(255,255,255,0.22);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .header .title small {
      display: block;
      font-size: 11px;
      font-weight: 400;
      opacity: .85;
      margin-top: 1px;
      color: #FFF3E4;
    }
    #exportBtn {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      color: #FFF8EF;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s;
      backdrop-filter: blur(4px);
    }
    #exportBtn:hover { background: rgba(255,255,255,0.3); }
    #exportBtn:active { transform: scale(.97); }

    /* 聊天区 */
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background:
        radial-gradient(1200px 400px at 100% 0%, #FBF1E6 0%, transparent 60%),
        radial-gradient(800px 300px at 0% 100%, #F7EBDA 0%, transparent 55%),
        var(--bg);
      scroll-behavior: smooth;
    }
    .chat-box::-webkit-scrollbar { width: 6px; }
    .chat-box::-webkit-scrollbar-thumb { background: #DCCBB6; border-radius: 3px; }

    .message {
      max-width: 82%;
      padding: 11px 15px;
      border-radius: var(--radius);
      font-size: 15px;
      line-height: 1.6;
      word-wrap: break-word;
      white-space: pre-wrap;
      animation: pop .18s ease-out;
      position: relative;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(6px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: #4A3020;
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 14px rgba(194,112,61,0.22);
    }
    .assistant {
      align-self: flex-start;
      background: var(--assistant-bubble);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
      box-shadow: 0 2px 10px rgba(120,90,60,0.06);
    }

    /* 消息操作栏 */
    .action-bar {
      display: none;
      position: absolute;
      bottom: -30px;
      left: 0;
      background: #FFF;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 4px;
      gap: 4px;
      z-index: 10;
    }
    .action-bar.show { display: flex; }
    .action-bar button {
      background: none;
      border: none;
      padding: 4px 8px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text);
      border-radius: 4px;
      transition: background 0.2s;
    }
    .action-bar button:hover { background: var(--brand-soft); }

    /* 消息内 Markdown 元素 */
    .message h1, .message h2, .message h3,
    .message h4, .message h5, .message h6 {
      margin: 10px 0 4px;
      font-size: 1em;
      font-weight: 700;
    }
    .message ul, .message ol { padding-left: 20px; margin: 6px 0; }
    .message li { margin: 3px 0; }
    .message code {
      background: rgba(194,112,61,0.10);
      color: #A5542A;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.9em;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .message pre {
      background: #3E342B;
      color: #F3E7D8;
      padding: 12px 14px;
      border-radius: 12px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 13px;
      line-height: 1.5;
    }
    .message pre code { background: none; padding: 0; color: inherit; }
    .user code { background: rgba(255,255,255,0.35); color: #6B3F1E; }
    .user pre { background: rgba(60,40,20,0.35); color: #FBF1E6; }

    /* 输入区 */
    .input-area {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: rgba(255,251,245,0.92);
      backdrop-filter: blur(10px);
    }
    #messageInput {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 22px;
      outline: none;
      font-size: 16px;
      background: #FBF5EC;
      transition: border-color .2s, box-shadow .2s, background .2s;
      color: var(--text);
    }
    #messageInput:focus {
      border-color: var(--brand-2);
      background: #FFFDF9;
      box-shadow: 0 0 0 4px rgba(224,164,88,0.18);
    }
    #messageInput::placeholder { color: #B3A392; }

    #sendBtn {
      width: 46px; height: 46px;
      flex: none;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #FFF8EF;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(194,112,61,0.30);
      transition: transform .15s, opacity .2s, box-shadow .2s;
    }
    #sendBtn:active { transform: scale(.94); }
    #sendBtn:disabled { opacity: .5; box-shadow: none; cursor: not-allowed; }

    /* 上传按钮 */
    #uploadBtn {
      width: 46px; height: 46px;
      flex: none;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #FBF5EC;
      color: var(--brand);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, transform .15s;
    }
    #uploadBtn:hover { background: #F5E9DA; }
    #uploadBtn:active { transform: scale(.94); }
    #uploadBtn:disabled { opacity: .5; cursor: not-allowed; }

    /* 文档预览条 */
    .file-chip {
      margin: 0 14px 10px;
      padding: 8px 12px;
      background: var(--brand-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 13px;
      color: var(--text-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      animation: pop .18s ease-out;
    }
    .file-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-chip button {
      flex: none;
      border: none;
      background: transparent;
      color: var(--brand);
      cursor: pointer;
      font-size: 15px;
      padding: 2px 6px;
    }

    /* 思考中动画 */
    .typing { display: inline-flex; gap: 4px; align-items: center; }
    .typing i {
      width: 6px; height: 6px; border-radius: 50%;
      background: #C2A184;
      display: inline-block;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .5; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    @media (max-width: 480px) {
      .container { box-shadow: none; }
      .message { max-width: 86%; font-size: 15px; }
    }

    /* 导出弹窗样式 */
    .modal-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: none; justify-content: center; align-items: flex-end;
      z-index: 100;
    }
    .modal-overlay.show { display: flex; }
    .modal-content {
      background: var(--card); width: 100%; max-height: 80%;
      border-radius: 20px 20px 0 0; padding: 20px;
      display: flex; flex-direction: column; animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .modal-header h3 { font-size: 16px; }
    .export-list { flex: 1; overflow-y: auto; margin-bottom: 15px; }
    .export-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .export-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--brand); }
    .export-controls { display: flex; gap: 10px; }
    .export-controls button {
      flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 15px; font-weight: 500; cursor: pointer;
    }
    .btn-cancel { background: #F5E9DA; color: var(--text); }
    .btn-confirm { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #FFF; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">
        <div class="logo">🤖</div>
        <div>
          DeepSeek Chat
          <small>智能助手 · 随时在线</small>
        </div>
      </div>
      <button id="exportBtn" title="导出对话记录"> 导出</button>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message assistant">你好！我是 DeepSeek 助手，有什么可以帮你的？</div>
    </div>

    <div class="input-area">
      <button id="uploadBtn" aria-label="上传文档" title="上传文档">📎</button>
      <input type="file" id="fileInput" accept=".txt,.md,.csv,.json,.log,.html,.xml,.js,.py,.css" hidden>
      <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off">
      <button id="sendBtn" aria-label="发送">➤</button>
    </div>

    <!-- 导出弹窗 -->
    <div class="modal-overlay" id="exportModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>选择要导出的对话</h3>
          <button class="btn-cancel" style="width:auto; padding:4px 10px;" onclick="closeExportModal()">关闭</button>
        </div>
        <div class="export-list" id="exportList">
          <!-- 动态生成 -->
        </div>
        <div class="export-controls">
          <button class="btn-cancel" onclick="toggleAllExports(true)">全选</button>
          <button class="btn-cancel" onclick="toggleAllExports(false)">取消全选</button>
          <button class="btn-confirm" onclick="doExport()">确认导出</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://api.desirekevi.asia';

    const chatBox = document.getElementById('chatBox');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const exportBtn = document.getElementById('exportBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const exportModal = document.getElementById('exportModal');
    const exportList = document.getElementById('exportList');

    let messages = [
      { role: 'system', content: '你是一个乐于助人的助手' }
    ];

    // ===== 附件状态 =====
    let attachedFile = null;

    uploadBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) { alert('文件太大，请上传 2MB 以内的文档'); fileInput.value = ''; return; }
      try {
        const text = await file.text();
        attachedFile = { name: file.name, content: text };
        showFileChip();
      } catch (e) { alert('读取文件失败：' + e.message); }
      finally { fileInput.value = ''; }
    });

    function showFileChip() {
      removeFileChip();
      if (!attachedFile) return;
      const chip = document.createElement('div');
      chip.className = 'file-chip';
      chip.id = 'fileChip';
      chip.innerHTML = `<span> ${escapeHtml(attachedFile.name)} · ${attachedFile.content.length} 字</span><button title="移除">✕</button>`;
      chip.querySelector('button').onclick = () => { attachedFile = null; removeFileChip(); };
      const inputArea = document.querySelector('.input-area');
      inputArea.parentNode.insertBefore(chip, inputArea);
    }

    function removeFileChip() {
      const old = document.getElementById('fileChip');
      if (old) old.remove();
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ===== 保存 / 恢复 =====
    function saveHistory() {
      try { localStorage.setItem('chat_history', JSON.stringify(messages)); } catch (e) {}
    }

    function restoreHistory() {
      const saved = localStorage.getItem('chat_history');
      if (!saved) return;
      try {
        const history = JSON.parse(saved);
        if (!Array.isArray(history) || history.length <= 1) return;
        messages = history.filter(m => m.role === 'user' || m.role === 'assistant' || m.role === 'system');
        chatBox.innerHTML = '';
        for (const m of messages) {
          if (m.role === 'user' || m.role === 'assistant') {
            addMessageToUI(m.role, m.content, m.editCount || 0, messages.indexOf(m));
          }
        }
      } catch (e) {}
    }

    function renderMarkdown(text) {
      let html = text;
      html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/^###### (.*$)/gm, '<h6>$1</h6>');
      html = html.replace(/^##### (.*$)/gm, '<h5>$1</h5>');
      html = html.replace(/^#### (.*$)/gm, '<h4>$1</h4>');
      html = html.replace(/^### (.*$)/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.*$)/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.*$)/gm, '<h1>$1</h1>');
      html = html.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
      html = html.replace(/^[\-\*] (.*$)/gm, '<li>$1</li>');
      html = html.replace(/^\d+\. (.*$)/gm, '<li>$1</li>');
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    // ===== 消息操作（长按弹出菜单、编辑、重生成） =====
    function addMessageToUI(role, content, editCount = 0, msgIndex = -1) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.dataset.index = msgIndex;
      div.innerHTML = renderMarkdown(content);

      if (role === 'assistant') {
        // 添加操作栏
        const actionBar = document.createElement('div');
        actionBar.className = 'action-bar';
        actionBar.innerHTML = `
          <button class="btn-edit">✏️ 编辑</button>
          <button class="btn-regen">🔄 重新生成</button>
        `;
        div.appendChild(actionBar);

        // 编辑逻辑
        actionBar.querySelector('.btn-edit').onclick = () => {
          if (editCount >= 4) return alert('该回答编辑次数已达上限（4次）');
          actionBar.classList.remove('show');
          startEditing(div, msgIndex, editCount);
        };

        // 重新生成逻辑
        actionBar.querySelector('.btn-regen').onclick = () => {
          actionBar.classList.remove('show');
          regenerateMessage(div, msgIndex);
        };

        // 长按事件
        let pressTimer = null;
        const startPress = (e) => {
          if (e.target.closest('.action-bar')) return;
          pressTimer = setTimeout(() => {
            document.querySelectorAll('.action-bar').forEach(b => b.classList.remove('show'));
            actionBar.classList.add('show');
          }, 500);
        };
        const cancelPress = () => clearTimeout(pressTimer);
        
        div.addEventListener('mousedown', startPress);
        div.addEventListener('touchstart', startPress, {passive: true});
        div.addEventListener('mouseup', cancelPress);
        div.addEventListener('mouseleave', cancelPress);
        div.addEventListener('touchend', cancelPress);
        div.addEventListener('touchmove', cancelPress);
      }

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 点击空白处关闭操作栏
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.message')) {
        document.querySelectorAll('.action-bar').forEach(b => b.classList.remove('show'));
      }
    });

    // 编辑功能
    function startEditing(div, msgIndex, editCount) {
      const originalHtml = div.innerHTML;
      const originalText = messages[msgIndex].content;
      
      div.innerHTML = `
        <textarea style="width:100%; min-height:80px; border:1px solid #ccc; border-radius:8px; padding:8px; font-size:15px; font-family:inherit; background:#fff; color:#333; resize:vertical;">${escapeHtml(originalText)}</textarea>
        <div style="margin-top:8px; display:flex; gap:8px; justify-content:flex-end;">
          <button class="btn-cancel" style="padding:4px 10px; border-radius:6px; border:none; background:#e0e0e0; cursor:pointer;">取消</button>
          <button class="btn-save" style="padding:4px 10px; border-radius:6px; border:none; background:var(--brand); color:#fff; cursor:pointer;">保存</button>
        </div>
      `;

      div.querySelector('.btn-cancel').onclick = () => {
        div.innerHTML = originalHtml;
        // 重新绑定事件
        addMessageToUI('assistant', originalText, editCount, msgIndex);
        div.remove(); // 移除旧的重新添加以保留样式和事件
      };

      div.querySelector('.btn-save').onclick = () => {
        const newText = div.querySelector('textarea').value;
        messages[msgIndex].content = newText;
        messages[msgIndex].editCount = editCount + 1;
        saveHistory();
        
        // 重新渲染该气泡
        div.innerHTML = renderMarkdown(newText);
        addMessageToUI('assistant', newText, editCount + 1, msgIndex);
        div.remove();
      };
    }

    // 重新生成功能
    async function regenerateMessage(div, msgIndex) {
      // 找到上一条用户消息
      let userMsgIndex = msgIndex - 1;
      while (userMsgIndex >= 0 && messages[userMsgIndex].role !== 'user') {
        userMsgIndex--;
      }
      if (userMsgIndex < 0) return alert('找不到对应的用户提问，无法重新生成');

      // 移除当前回答及之后的消息
      const userMessage = messages[userMsgIndex];
      messages = messages.slice(0, msgIndex); 
      
      // 清理 UI 中这之后的消息
      const children = Array.from(chatBox.children);
      let startRemove = false;
      for (let i = 0; i < children.length; i++) {
        if (children[i] === div) startRemove = true;
        if (startRemove) chatBox.removeChild(children[i]);
      }

      // 准备请求
      setLoading(true);
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message assistant';
      loadingDiv.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
      chatBox.appendChild(loadingDiv);

      await fetchAPI(messages, loadingDiv);
    }

    function setLoading(isLoading) {
      sendBtn.disabled = isLoading;
      messageInput.disabled = isLoading;
      uploadBtn.disabled = isLoading;
    }

    // ===== 统一请求逻辑（流式） =====
    async function fetchAPI(messagesPayload, loadingDiv) {
      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: messagesPayload,
            stream: true, // 开启流式
          }),
        });

        if (!response.ok) throw new Error('Network response was not ok');

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let assistantMessage = '';
        let buffer = '';
        
        // 第一次清理掉“正在思考”动画
        loadingDiv.innerHTML = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); // 保留最后一行可能不完整的

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || trimmed === 'data: [DONE]') continue;
            if (trimmed.startsWith('data: ')) {
              try {
                const data = JSON.parse(trimmed.slice(6));
                const delta = data.choices[0]?.delta?.content || '';
                if (delta) {
                  assistantMessage += delta;
                  loadingDiv.innerHTML = renderMarkdown(assistantMessage);
                  chatBox.scrollTop = chatBox.scrollHeight;
                }
              } catch (e) {}
            }
          }
        }

        // 流结束，保存
        if (assistantMessage) {
          const newIndex = messages.length;
          messages.push({ role: 'assistant', content: assistantMessage, editCount: 0 });
          saveHistory();
          
          // 把正在流式的那个 div 替换为标准带有操作栏的 DOM
          loadingDiv.remove();
          addMessageToUI('assistant', assistantMessage, 0, newIndex);
        } else {
          loadingDiv.innerHTML = ' 请求出错或内容为空';
        }

      } catch (error) {
        loadingDiv.innerHTML = ' 网络错误，检查 Worker 是否正常';
      } finally {
        setLoading(false);
      }
    }

    async function sendMessage() {
      let userMessage = messageInput.value.trim();
      if (!userMessage && !attachedFile) return;

      let displayMessage = userMessage;
      let apiMessage = userMessage;

      if (attachedFile) {
        const fileBlock = `【文档：${attachedFile.name}】\n${attachedFile.content}`;
        displayMessage = (userMessage ? userMessage + '\n\n' : '') + ` 已上传文档：${attachedFile.name}`;
        apiMessage = (userMessage ? userMessage + '\n\n' : '') + fileBlock;
      }

      const newIndex = messages.length;
      addMessageToUI('user', displayMessage, 0, newIndex);
      messages.push({ role: 'user', content: apiMessage });
      saveHistory();
      
      messageInput.value = '';
      attachedFile = null;
      removeFileChip();
      setLoading(true);

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message assistant';
      loadingDiv.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      await fetchAPI(messages, loadingDiv);
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    // ===== 选择导出功能 =====
    exportBtn.addEventListener('click', () => {
      if (messages.length <= 1) return alert('当前没有对话记录可导出');
      
      let html = '';
      let roundCount = 0;
      
      for (let i = 0; i < messages.length; i++) {
        if (messages[i].role === 'user') {
          const nextMsg = messages[i+1];
          const assistantMsg = (nextMsg && nextMsg.role === 'assistant') ? nextMsg : null;
          
          roundCount++;
          const questionSnippet = messages[i].content.slice(0, 20).replace(/</g, '&lt;') + (messages[i].content.length > 20 ? '...' : '');
          const answerSnippet = assistantMsg ? (assistantMsg.content.slice(0, 20).replace(/</g, '&lt;') + (assistantMsg.content.length > 20 ? '...' : '')) : '（无回答）';

          html += `
            <label class="export-item">
              <input type="checkbox" class="export-checkbox" data-user="${i}" data-assistant="${assistantMsg ? i+1 : -1}" checked>
              <div>
                <div style="font-weight:600; color:#4A3F35;">Q: ${questionSnippet}</div>
                <div style="font-size:12px; color:#8A7A6A;">A: ${answerSnippet}</div>
              </div>
            </label>
          `;
        }
      }
      exportList.innerHTML = html;
      exportModal.classList.add('show');
    });

    function closeExportModal() { exportModal.classList.remove('show'); }
    
    function toggleAllExports(checked) {
      document.querySelectorAll('.export-checkbox').forEach(cb => cb.checked = checked);
    }

    function doExport() {
      const checkedBoxes = document.querySelectorAll('.export-checkbox:checked');
      if (checkedBoxes.length === 0) return alert('请至少选择一轮对话');

      let exportText = '';
      checkedBoxes.forEach(cb => {
        const uIndex = parseInt(cb.dataset.user);
        const aIndex = parseInt(cb.dataset.assistant);
        
        exportText += `🧑 你：\n${messages[uIndex].content}\n\n`;
        if (aIndex !== -1) {
          exportText += `🤖 DeepSeek：\n${messages[aIndex].content}\n\n`;
        }
        exportText += `-------------------\n\n`;
      });

      const blob = new Blob([exportText], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const now = new Date();
      const timestamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}`;
      a.download = `DeepSeek聊天记录_${timestamp}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      closeExportModal();
    }

    // 双击标题清空记录
    document.querySelector('.header .title').addEventListener('dblclick', () => {
      if (!confirm('确定清空所有聊天记录？')) return;
      localStorage.removeItem('chat_history');
      messages = [{ role: 'system', content: '你是一个乐于助人的助手' }];
      chatBox.innerHTML = '';
      addMessageToUI('assistant', '你好！我是 DeepSeek 助手，有什么可以帮你的？', 0, 1);
    });

    // 启动恢复历史
    window.onload = () => {
      const saved = localStorage.getItem('chat_history');
      if (!saved) {
        // 给初始欢迎语添加操作栏支持
        chatBox.innerHTML = '';
        messages.push({ role: 'assistant', content: '你好！我是 DeepSeek 助手，有什么可以帮你的？', editCount: 0 });
        addMessageToUI('assistant', messages[1].content, 0, 1);
        saveHistory();
      } else {
        restoreHistory();
      }
    };
  </script>
</body>
</html>
